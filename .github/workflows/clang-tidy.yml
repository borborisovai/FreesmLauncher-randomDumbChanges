name: Clang-Tidy Code Scanning

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  merge_group:
    types: [ checks_requested ]
  pull_request:

permissions: { }

jobs:
  clang-tidy:
    name: Run Clang-Tidy

    runs-on: ubuntu-latest

    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0 # Required for diffing later on
          submodules: "true"

      - name: Setup sccache
        uses: hendrikmuhs/ccache-action@v1.2.22
        with:
          variant: sccache

      - name: Install Nix
        uses: cachix/install-nix-action@v31

      - name: Run build
        # TODO(@getchoo): Figure out how to make this work with PCH
        run: |
          nix develop --command bash -c '
            cmake -B build -D Launcher_USE_PCH=OFF -D CMAKE_EXPORT_COMPILE_COMMANDS=ON -D CMAKE_CXX_COMPILER_LAUNCHER=sccache && cmake --build build
          '

      # TODO: Use SARIF after https://github.com/psastras/sarif-rs/issues/638 is fixed
      - name: Run clang-tidy-diff
        env:
          BASE_REF: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
        run: |
          nix develop --command bash -c '
            set -euo pipefail
            clang-tidy -verify-config
            # The Nix compiler wrapper injects the Qt include root, but clang-tidy
            # does not run through that wrapper when reading compile_commands.json.
            qt_headers="$(pkg-config --variable=includedir Qt6Core)"
            test -f "$qt_headers/QtCore/qglobal.h"
            git diff -U0 --no-color "$BASE_REF" | python3 scripts/clang-tidy-diff.py -p1 -path build -quiet -only-check-in-db "-extra-arg=-I$qt_headers"
          '
