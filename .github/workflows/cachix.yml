name: "Cachix build"
on:
  push:
    branches-ignore:
      - "renovate/**"
      - "docs/**"
    paths-ignore:
      - "docs"
      - "**.md"
      - "packages"
      - ".github/ISSUE_TEMPLATE"
      - ".markdownlint"
  pull_request:
    paths-ignore:
      - "docs"
      - "**.md"
      - "flake.lock"
      - "packages"
      - ".github/ISSUE_TEMPLATE"
      - ".markdownlint"
  workflow_dispatch:

jobs:
  build-and-cache:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v25
        with:
          nix_path: nixpkgs=channel:nixos-unstable
      - uses: cachix/cachix-action@v14
        with:
          name: freesmlauncher
          authToken: "${{ secrets.CACHIX_AUTH_TOKEN }}"
      - name: Build with full diagnostics
        run: nix build -L
      - name: Publish to upstream Cachix
        if: ${{ github.repository == 'FreesmTeam/FreesmLauncher' && github.event_name == 'push' }}
        shell: bash
        run: |
          set -o pipefail
          nix path-info .#default | cachix push freesmlauncher
      - run: |
          nix develop --command true
          echo "OK"
